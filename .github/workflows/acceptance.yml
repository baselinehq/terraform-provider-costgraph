name: API lifecycle acceptance

on:
  workflow_dispatch:
    inputs:
      cli:
        description: CLI used for the lifecycle scenarios
        type: choice
        default: terraform
        options: [terraform, opentofu]
      suite:
        description: Lifecycle suite to run against the isolated deployment
        type: choice
        default: core
        options: [core, aws, gcp, azure, kubernetes, virtual-tags, all]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: acceptance
    env:
      TEST_SUITE: ${{ inputs.suite }}
      COSTGRAPH_TEST_MANAGEMENT_API_KEY: ${{ secrets.COSTGRAPH_TEST_MANAGEMENT_API_KEY }}
      COSTGRAPH_TEST_MODEL_KEY: ${{ vars.COSTGRAPH_TEST_MODEL_KEY }}
      COSTGRAPH_TEST_AWS_BILLING_ACCOUNT_ID: ${{ vars.COSTGRAPH_TEST_AWS_BILLING_ACCOUNT_ID }}
      COSTGRAPH_TEST_AWS_REGION: ${{ vars.COSTGRAPH_TEST_AWS_REGION }}
      COSTGRAPH_TEST_AWS_BUCKET: ${{ vars.COSTGRAPH_TEST_AWS_BUCKET }}
      COSTGRAPH_TEST_AWS_PREFIX: ${{ vars.COSTGRAPH_TEST_AWS_PREFIX }}
      COSTGRAPH_TEST_AWS_ROLE_ARN: ${{ vars.COSTGRAPH_TEST_AWS_ROLE_ARN }}
      COSTGRAPH_TEST_GCP_BILLING_ACCOUNT_ID: ${{ vars.COSTGRAPH_TEST_GCP_BILLING_ACCOUNT_ID }}
      COSTGRAPH_TEST_GCP_QUERY_PROJECT: ${{ vars.COSTGRAPH_TEST_GCP_QUERY_PROJECT }}
      COSTGRAPH_TEST_GCP_TARGET_PRINCIPAL: ${{ vars.COSTGRAPH_TEST_GCP_TARGET_PRINCIPAL }}
      COSTGRAPH_TEST_AZURE_TENANT_ID: ${{ vars.COSTGRAPH_TEST_AZURE_TENANT_ID }}
      COSTGRAPH_TEST_AZURE_CLIENT_ID: ${{ vars.COSTGRAPH_TEST_AZURE_CLIENT_ID }}
      COSTGRAPH_TEST_AZURE_CLIENT_SECRET: ${{ secrets.COSTGRAPH_TEST_AZURE_CLIENT_SECRET }}
      COSTGRAPH_TEST_AZURE_ROTATED_CLIENT_SECRET: ${{ secrets.COSTGRAPH_TEST_AZURE_ROTATED_CLIENT_SECRET }}
      COSTGRAPH_TEST_AZURE_STORAGE_ACCOUNT: ${{ vars.COSTGRAPH_TEST_AZURE_STORAGE_ACCOUNT }}
      COSTGRAPH_TEST_AZURE_CONTAINER: ${{ vars.COSTGRAPH_TEST_AZURE_CONTAINER }}
      COSTGRAPH_TEST_AZURE_EXPORT_NAME: ${{ vars.COSTGRAPH_TEST_AZURE_EXPORT_NAME }}
      COSTGRAPH_TEST_VIRTUAL_TAG_RESOURCE_ID: ${{ vars.COSTGRAPH_TEST_VIRTUAL_TAG_RESOURCE_ID }}
      COSTGRAPH_TEST_OTHER_TENANT_ID: ${{ vars.COSTGRAPH_TEST_OTHER_TENANT_ID }}
      COSTGRAPH_TEST_API_URL: ${{ vars.COSTGRAPH_TEST_API_URL }}
      COSTGRAPH_TEST_API_KEY: ${{ secrets.COSTGRAPH_TEST_API_KEY }}
      COSTGRAPH_TEST_TENANT_ID: ${{ vars.COSTGRAPH_TEST_TENANT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - if: inputs.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - if: inputs.cli == 'opentofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.13.10
          tofu_wrapper: false
      - if: inputs.cli == 'opentofu'
        name: Select OpenTofu for the acceptance runner
        run: |
          printf '%s\n' "TF_ACC_TERRAFORM_PATH=$(command -v tofu)" \
            "TF_ACC_PROVIDER_HOST=registry.opentofu.org" \
            "TF_ACC_PROVIDER_NAMESPACE=baselinehq" >> "$GITHUB_ENV"
      - name: Run the selected lifecycle suite
        run: |
          case "$TEST_SUITE" in
            core) make testacc-core ;;
            aws) make testacc-aws ;;
            gcp) make testacc-gcp ;;
            azure) make testacc-azure ;;
            kubernetes) make testacc-kubernetes ;;
            virtual-tags) make testacc-virtual-tags ;;
            all) make testacc ;;
            *) exit 1 ;;
          esac
